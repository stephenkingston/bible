[package]
name = "bible"
version = "0.3.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "A beautiful TUI Bible reader with on-demand translation downloads"
repository = "https://github.com/stephenkingston/bible"
readme = "README.md"
keywords = ["bible", "tui", "scripture", "ratatui"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/tests/fixtures", "/screenshots"]

[dependencies]
# Core / library
bibleref = "0.4"
# Pinned: bincode 3.0.0 was published as a tombstone-only release after the
# project went unmaintained. 2.0.1 is the last working version.
bincode = { version = "=2.0.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
directories = "5"
ureq = { version = "3", features = ["json"] }
thiserror = "2"
anyhow = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
unicode-segmentation = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# TUI / CLI
# crossterm_0_29 explicitly pins ratatui's crossterm dep to match our own.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "underline-color", "all-widgets", "macros", "layout-cache"] }
crossterm = "0.29"
tui-input = "0.15"
clap = { version = "4", features = ["derive"] }
# Cross-platform clipboard for the `y` / `:y` yank commands. On Linux this
# brings in X11/Wayland system libraries; on a headless tty `Clipboard::new`
# returns an error which we surface as a status message.
# `wayland-data-control` is not a default feature of arboard 3.6+, and
# without it Linux builds only speak X11/XWayland.
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "bible"
path = "src/bin/bible.rs"

[profile.release]
lto = "thin"
strip = true
